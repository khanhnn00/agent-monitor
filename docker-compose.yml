name: cc-harness
services:
  dashboard:
    build: .
    image: cc-harness-dashboard:local
    container_name: cc-harness-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      HOST_HOME: ${HOME}
      USAGE_CACHE: /host-tmp/ck-usage-limits-cache.json
      DATA_DIR: /data
    volumes:
      - ${HOME}/.claude/sessions:/claude/sessions:ro
      - ${HOME}/.claude/harness:/claude/harness:ro
      - ${HOME}/.claude/projects:/claude/projects:ro
      - ${TMPDIR:-/tmp}:/host-tmp:ro
      - usage-data:/data
volumes:
  usage-data:
